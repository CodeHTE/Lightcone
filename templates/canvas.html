<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>协作画布</title>
    <style>
        :root {
            --bg: #f4f1ea;
            --surface: #fcfaf5;
            --card-bg: #ffffff;
            --card-border: #d4cdbc;
            --text: #3e3a35;
            --text-secondary: #6b6560;
            --accent: #4a6fa5;
            --accent-hover: #5e8bc2;
            --danger: #c0392b;
            --point-color: #5b8def;
            --point-hover: #ff9f43;
            --line-color: #2c3e50;
            --line-hover: #d35400;
            --toolbar-bg: rgba(252, 250, 245, 0.9);
            --shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
            --radius: 12px;
            --grid-color: rgba(180, 170, 150, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
        }
        #loading-overlay {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(244, 241, 234, 0.85);
            backdrop-filter: blur(4px);
            z-index: 10001;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 24px; font-size: 18px;
        }
        .loading-spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(74, 111, 165, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #users-bar {
            position: fixed; top: 80px; right: 20px;
            z-index: 1000;
            display: flex; gap: 8px; flex-wrap: wrap;
            max-width: 300px; justify-content: flex-end;
        }
        .user-badge {
            display: flex; align-items: center; gap: 6px;
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--card-border);
        }
        .user-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.8); }
        }
        .cursor-label {
            position: absolute;
            font-size: 11px; padding: 2px 6px;
            border-radius: 4px; white-space: nowrap;
            pointer-events: none; z-index: 999;
            transform: translate(-50%, -100%);
            margin-top: -10px;
        }
        #cursor-glow {
            position: fixed;
            width: 24px; height: 24px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(91, 141, 239, 0.8);
            background: transparent;
        }
        #global-toolbar {
            position: fixed; top: 16px; left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex; gap: 6px;
            background: var(--toolbar-bg);
            padding: 8px 16px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            align-items: center; flex-wrap: wrap;
        }
        #global-toolbar button, #global-toolbar a {
            background: transparent; border: 1px solid transparent;
            color: var(--text); cursor: pointer;
            padding: 10px 18px; border-radius: 50px;
            font-size: 14px; font-weight: 500;
            transition: 0.2s; white-space: nowrap;
            display: flex; align-items: center; gap: 6px;
            text-decoration: none;
        }
        #global-toolbar button:hover { background: rgba(0,0,0,0.03); border-color: var(--card-border); }
        .accent { background: var(--accent) !important; color: #fff !important; }
        .danger { color: var(--danger) !important; }
        .divider { width: 1px; height: 20px; background: var(--card-border); margin: 0 4px; }
        #canvas-viewport {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            overflow: auto; cursor: default;
            background-color: #fcf9f2;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        #canvas-viewport.grid-hidden { background-image: none; }
        #canvas {
            position: relative;
            width: 6000px; height: 4500px;
            min-width: 100vw; min-height: 100vh;
        }
        #connections-svg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        #connections-svg g.connection-group { pointer-events: auto; }
        #connections-svg path.connection-path {
            pointer-events: stroke; cursor: pointer;
            stroke: #2c3e50; stroke-width: 2.2;
            transition: stroke 0.15s, stroke-width 0.15s;
        }
        #connections-svg path.connection-path:hover {
            stroke: var(--line-hover); stroke-width: 3.2px;
            filter: drop-shadow(0 0 6px rgba(211, 84, 0, 0.4));
        }
        .conn-delete-btn { cursor: pointer; opacity: 0; transition: opacity 0.2s; fill: rgba(255,255,255,0.95); stroke: #c0392b; stroke-width: 1.8; }
        .conn-delete-text { fill: #c0392b; font-size: 16px; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
        .connection-group:hover .conn-delete-btn, .connection-group:hover .conn-delete-text { opacity: 1; }
        #temp-line-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #temp-line-svg path { stroke: #ff9f43; stroke-width: 3; stroke-dasharray: 8 5; animation: dash-flow 0.6s linear infinite; }
        @keyframes dash-flow { to { stroke-dashoffset: -26; } }
        .card {
            position: absolute; width: 300px;
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow); z-index: 5;
            transition: box-shadow 0.25s, border-color 0.25s;
            display: flex; flex-direction: column; min-height: 160px;
        }
        .card:hover { box-shadow: var(--shadow-lg); border-color: #b0a89a; z-index: 20; }
        .card.dragging { box-shadow: 0 16px 48px rgba(0,0,0,0.15); border-color: var(--accent); z-index: 30; opacity: 0.95; transition: none; }
        .card.editing { border-color: var(--point-hover); box-shadow: 0 0 0 4px rgba(255,159,67,0.2); }
        .card-handle {
            height: 36px; cursor: grab;
            border-radius: var(--radius) var(--radius) 0 0;
            display: flex; align-items: center;
            padding: 0 14px; gap: 8px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .card-handle:active { cursor: grabbing; }
        .card-handle .dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--text-secondary); display: inline-block; margin-right: 3px; }
        .card-index { font-size: 10px; color: var(--text-secondary); font-weight: 600; }
        .card-delete { margin-left: auto; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 16px; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; opacity: 0.5; }
        .card-delete:hover { background: rgba(192,57,43,0.1); color: var(--danger); opacity: 1; }
        .card-format-bar { display: flex; gap: 2px; padding: 4px 8px; flex-shrink: 0; border-bottom: 1px solid rgba(0,0,0,0.04); background: rgba(0,0,0,0.02); flex-wrap: wrap; }
        .card-format-bar button { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; width: 26px; height: 26px; border-radius: 4px; font-size: 12px; transition: 0.2s; display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .card-format-bar button:hover { background: rgba(0,0,0,0.06); color: var(--text); }
        .card-content { flex: 1 1 auto; padding: 14px 16px; outline: none; overflow-y: auto; font-size: 14px; line-height: 1.7; color: var(--text); cursor: text; user-select: text; -webkit-user-select: text; word-break: break-word; border-radius: 0 0 var(--radius) var(--radius); min-height: 80px; }
        .card-content:focus { background: rgba(0,0,0,0.01); }
        .card-content::-webkit-scrollbar { width: 5px; }
        .card-content::-webkit-scrollbar-track { background: transparent; }
        .card-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
        .card-content img { max-width: 100%; border-radius: 6px; margin: 8px 0; display: block; }
        .video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; margin: 10px 0; border-radius: 8px; overflow: hidden; background: #000; pointer-events: auto; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 8px; }
        .video-label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); color: #fff; padding: 3px 10px; border-radius: 20px; font-size: 11px; pointer-events: none; z-index: 2; backdrop-filter: blur(4px); }
        .video-fullscreen-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(30,30,30,0.8); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-size: 20px; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; transition: background 0.2s; }
        .video-fullscreen-btn:hover { background: rgba(0,0,0,0.9); }
        .connection-point { position: absolute; width: 14px; height: 14px; background: var(--point-color); border-radius: 50%; cursor: crosshair; z-index: 6; opacity: 0; transition: opacity 0.2s, transform 0.2s, background 0.2s, box-shadow 0.2s; border: 2px solid var(--card-bg); }
        .card:hover .connection-point, .card.dragging .connection-point { opacity: 0.7; }
        .connection-point:hover { opacity: 1 !important; transform: scale(1.6) !important; background: var(--point-hover) !important; box-shadow: 0 0 0 6px rgba(255,159,67,0.4) !important; z-index: 50 !important; animation: pulse-point 0.8s ease-out infinite; }
        .connection-point.active-connect { opacity: 1 !important; background: var(--point-hover) !important; transform: scale(1.6) !important; box-shadow: 0 0 0 8px rgba(255,159,67,0.5) !important; animation: pulse-point 0.6s ease-out infinite; }
        @keyframes pulse-point { 0%,100% { box-shadow: 0 0 0 4px rgba(255,159,67,0.4); } 50% { box-shadow: 0 0 0 14px rgba(255,159,67,0); } }
        .connection-point.top { top: -7px; left: 50%; transform: translateX(-50%); }
        .connection-point.bottom { bottom: -7px; left: 50%; transform: translateX(-50%); }
        .connection-point.left { left: -7px; top: 50%; transform: translateY(-50%); }
        .connection-point.right { right: -7px; top: 50%; transform: translateY(-50%); }
        .resize-handle { position: absolute; bottom: 2px; right: 2px; width: 18px; height: 18px; background: linear-gradient(135deg, transparent 40%, var(--card-border) 40%, var(--card-border) 50%, transparent 50%), linear-gradient(135deg, transparent 40%, var(--card-border) 40%, var(--card-border) 50%, transparent 50%); background-size: 5px 5px; background-position: 0 0, 4px 4px; cursor: nwse-resize; z-index: 8; border-radius: 0 0 var(--radius) 0; opacity: 0.5; transition: opacity 0.2s; }
        .card:hover .resize-handle { opacity: 0.8; }
        .resize-handle:hover { opacity: 1; }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #3e3e3e; color: #fff; padding: 12px 24px; border-radius: 50px; font-size: 13px; z-index: 2000; pointer-events: none; transition: transform 0.35s; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
        #toast.show { transform: translateX(-50%) translateY(0); }
        #toast.success { background: #2d6a4f; }
        #toast.warning { background: #8b6b2a; }
        #status-indicator { position: fixed; bottom: 20px; left: 20px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); background: var(--card-bg); padding: 8px 14px; border-radius: 20px; box-shadow: var(--shadow); z-index: 1000; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #888; }
        .status-dot.connected { background: #2d6a4f; animation: pulse 2s infinite; }
        .status-dot.disconnected { background: var(--danger); }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <span>连接服务器中...</span>
    </div>

    <div id="cursor-glow"></div>
    <div id="users-bar"></div>

    <div id="global-toolbar">
        <button class="accent" id="addCardBtn">+ 新建卡片</button>
        <span class="divider"></span>
        <button id="syncBtn">同步</button>
        <span class="divider"></span>
        <button id="exportBtn">导出</button>
        <button id="importBtn">导入</button>
        <span class="divider"></span>
        <button id="gridToggle">网格: 开</button>
        <span class="divider"></span>
        <button id="clearBtn" class="danger">清空</button>
    </div>

    <div id="canvas-viewport">
        <div id="canvas">
            <svg id="connections-svg"></svg>
            <svg id="temp-line-svg"></svg>
        </div>
    </div>

    <div id="status-indicator">
        <div class="status-dot disconnected" id="connectionDot"></div>
        <span id="connectionStatus">连接中...</span>
    </div>

    <div id="toast"></div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
    (function() {
        // 用户标识
        const USER_ID_KEY = 'canvas_user_id';
        let userId = localStorage.getItem(USER_ID_KEY);
        if (!userId) { userId = 'user-' + Math.random().toString(36).substr(2, 9); localStorage.setItem(USER_ID_KEY, userId); }

        // 生成随机颜色
        const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#34495e'];
        const userColor = colors[Math.floor(Math.random() * colors.length)];

        // 连接服务器
        const socket = io({ transports: ['polling', 'websocket'], reconnection: true, reconnectionAttempts: 10, reconnectionDelay: 1000 });

        const canvasViewport = document.getElementById('canvas-viewport');
        const canvas = document.getElementById('canvas');
        const connectionsSvg = document.getElementById('connections-svg');
        const tempLineSvg = document.getElementById('temp-line-svg');
        const toastEl = document.getElementById('toast');
        const gridToggleBtn = document.getElementById('gridToggle');
        const cursorGlow = document.getElementById('cursor-glow');
        const loadingOverlay = document.getElementById('loading-overlay');
        const usersBar = document.getElementById('users-bar');
        const connectionDot = document.getElementById('connectionDot');
        const connectionStatus = document.getElementById('connectionStatus');

        // 状态
        let cards = [];
        let connections = [];
        let showGrid = true;
        let activeUsers = [];
        let lastDebounceTime = {};

        // 连接状态
        socket.on('connect', () => {
            connectionDot.className = 'status-dot connected';
            connectionStatus.textContent = '已连接';
            showToast('已连接到服务器', 'success');
            showLoading();
            socket.emit('join_canvas', { user_id: userId, username: '用户' + userId.substr(-4), color: userColor });
        });

        socket.on('disconnect', () => {
            connectionDot.className = 'status-dot disconnected';
            connectionStatus.textContent = '断开连接';
        });

        socket.on('connect_error', () => {
            connectionDot.className = 'status-dot disconnected';
            connectionStatus.textContent = '重连中...';
        });

        // 用户列表更新
        socket.on('user_joined', (data) => {
            activeUsers = data.active_users || [];
            updateUsersBar();
            if (data.user_id !== userId) showToast(`${data.username} 加入了画布`, '');
        });

        socket.on('user_left', (data) => {
            activeUsers = data.active_users || [];
            updateUsersBar();
            showToast(`${data.username} 离开了画布`, '');
        });

        // 画布数据
        socket.on('canvas_data', (data) => {
            cards = data.cards || [];
            connections = data.connections || [];
            activeUsers = data.active_users || [];
            renderAllCards();
            updateAllConnections();
            updateUsersBar();
            hideLoading();
        });

        // 实时卡片更新（其他用户）
        socket.on('card_updated', (data) => {
            const idx = cards.findIndex(c => c.id === data.card.id);
            if (idx >= 0) cards[idx] = data.card;
            else cards.push(data.card);
            updateCardElement(data.card);
            updateAllConnections();
        });

        socket.on('card_created', (data) => {
            if (!cards.find(c => c.id === data.card.id)) {
                cards.push(data.card);
                renderCard(data.card);
                updateAllConnections();
            }
        });

        socket.on('card_deleted', (data) => {
            cards = cards.filter(c => c.id !== data.card_id);
            document.querySelector(`[data-card-id="${data.card_id}"]`)?.remove();
            connections = connections.filter(cn => cn.fromCardId !== data.card_id && cn.toCardId !== data.card_id);
            updateAllConnections();
        });

        // 实时连线更新
        socket.on('connection_created', (data) => {
            if (!connections.find(c => c.id === data.connection.id)) {
                connections.push(data.connection);
                updateAllConnections();
            }
        });

        socket.on('connection_deleted', (data) => {
            connections = connections.filter(c => c.id !== data.connection_id);
            updateAllConnections();
        });

        // 光标同步
        socket.on('cursor_update', (data) => {
            updateRemoteCursor(data);
        });

        // 同步响应
        socket.on('sync_response', (data) => {
            cards = data.cards || [];
            connections = data.connections || [];
            activeUsers = data.active_users || [];
            renderAllCards();
            updateAllConnections();
            updateUsersBar();
            hideLoading();
            showToast('同步完成', 'success');
        });

        socket.on('sync_result', (data) => {
            cards = data.cards || [];
            connections = data.connections || [];
            renderAllCards();
            updateAllConnections();
            hideLoading();
            showToast(data.success ? '同步成功' : '同步完成（部分冲突）', data.success ? 'success' : 'warning');
        });

        // 工具函数
        function showToast(msg, type='') {
            if (window.toastTimer) clearTimeout(window.toastTimer);
            toastEl.textContent = msg; toastEl.className = 'show ' + type;
            window.toastTimer = setTimeout(() => { toastEl.className = ''; }, 3000);
        }

        function showLoading() { loadingOverlay.style.display = 'flex'; }
        function hideLoading() { loadingOverlay.style.display = 'none'; }

        function generateId(prefix) { return (crypto.randomUUID ? crypto.randomUUID() : prefix + Date.now() + Math.random().toString(36).substr(2,5)); }

        function updateUsersBar() {
            usersBar.innerHTML = activeUsers.map(u => `
                <div class="user-badge">
                    <div class="user-dot" style="background:${u.color}"></div>
                    <span>${u.username}</span>
                </div>
            `).join('');
        }

        // 远程光标
        function updateRemoteCursor(data) {
            let label = document.querySelector(`[data-cursor-id="${data.user_id}"]`);
            if (!label) {
                label = document.createElement('div');
                label.className = 'cursor-label';
                label.setAttribute('data-cursor-id', data.user_id);
                label.style.background = data.color;
                label.style.color = '#fff';
                canvas.appendChild(label);
            }
            label.textContent = data.username;
            label.style.left = data.x + 'px';
            label.style.top = data.y + 'px';
        }

        // 鼠标光晕
        document.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
            const target = e.target;
            const isEditable = target.isContentEditable || target.closest('.card-content') ||
                               target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' ||
                               target.tagName === 'A' || target.tagName === 'BUTTON' ||
                               target.closest('button');
            cursorGlow.classList.toggle('text-mode', isEditable);

            // 发送光标位置
            const canvasRect = canvas.getBoundingClientRect();
            socket.emit('cursor_move', { x: e.clientX - canvasRect.left, y: e.clientY - canvasRect.top });
        });
        document.addEventListener('mouseleave', () => { cursorGlow.style.display = 'none'; });
        document.addEventListener('mouseenter', () => { cursorGlow.style.display = 'block'; });

        // 卡片操作
        function createCardElement(cardData) {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.setAttribute('data-card-id', cardData.id);
            cardEl.style.left = (cardData.x || 0) + 'px';
            cardEl.style.top = (cardData.y || 0) + 'px';
            cardEl.style.width = (cardData.width || 300) + 'px';
            cardEl.style.height = (cardData.height || 200) + 'px';

            const handle = document.createElement('div');
            handle.className = 'card-handle';
            handle.innerHTML = `<span class="dots"><span></span><span></span><span></span></span>
                                <span class="card-index">卡片</span>
                                <button class="card-delete" title="删除">x</button>`;
            handle.querySelector('.card-delete').addEventListener('click', (e) => { e.stopPropagation(); deleteCard(cardData.id); });
            handle.addEventListener('mousedown', (e) => onCardDragStart(e, cardData.id));
            cardEl.appendChild(handle);

            const formatBar = document.createElement('div');
            formatBar.className = 'card-format-bar';
            formatBar.innerHTML = `<button data-cmd="bold" title="加粗"><b>B</b></button>
                <button data-cmd="italic" title="斜体"><i>I</i></button>
                <button data-cmd="underline" title="下划线"><u>U</u></button>
                <button data-cmd="insertUnorderedList" title="列表">&bull;</button>`;
            formatBar.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const cmd = btn.getAttribute('data-cmd');
                    const contentEl = cardEl.querySelector('.card-content');
                    contentEl.focus();
                    document.execCommand(cmd, false, null);
                    updateLocalCardData(cardData.id);
                });
            });
            cardEl.appendChild(formatBar);

            const contentEl = document.createElement('div');
            contentEl.className = 'card-content';
            contentEl.setAttribute('contenteditable', 'true');
            contentEl.innerHTML = cardData.content || '<p>双击编辑...</p>';
            contentEl.addEventListener('input', () => updateLocalCardData(cardData.id));
            contentEl.addEventListener('paste', (e) => handlePaste(e, cardData.id));
            contentEl.addEventListener('mousedown', (e) => e.stopPropagation());
            cardEl.appendChild(contentEl);

            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'resize-handle';
            resizeHandle.addEventListener('mousedown', (e) => onResizeStart(e, cardData.id));
            cardEl.appendChild(resizeHandle);

            ['top','bottom','left','right'].forEach(side => {
                const point = document.createElement('div');
                point.className = `connection-point ${side}`;
                point.setAttribute('data-side', side);
                point.setAttribute('data-card-id', cardData.id);
                point.addEventListener('mousedown', (e) => onPointMouseDown(e, cardData.id, side));
                cardEl.appendChild(point);
            });

            return cardEl;
        }

        function updateCardElement(cardData) {
            let cardEl = document.querySelector(`[data-card-id="${cardData.id}"]`);
            if (!cardEl && cards.find(c => c.id === cardData.id)) {
                cardEl = createCardElement(cardData);
                canvas.appendChild(cardEl);
            } else if (!cardEl) return;

            cardEl.style.left = (cardData.x || 0) + 'px';
            cardEl.style.top = (cardData.y || 0) + 'px';
            cardEl.style.width = (cardData.width || 300) + 'px';
            cardEl.style.height = (cardData.height || 200) + 'px';
            cardEl.querySelector('.card-content').innerHTML = cardData.content || '';
        }

        function renderCard(cardData) {
            const el = createCardElement(cardData);
            canvas.appendChild(el);
        }

        function renderAllCards() {
            canvas.querySelectorAll('.card').forEach(el => el.remove());
            cards.forEach(cardData => canvas.appendChild(createCardElement(cardData)));
        }

        function updateLocalCardData(cardId, debounceMs = 300) {
            const card = cards.find(c => c.id === cardId);
            const el = document.querySelector(`[data-card-id="${cardId}"] .card-content`);
            if (!card || !el) return;
            card.content = el.innerHTML;

            // 防抖发送
            const key = cardId + '_update';
            if (lastDebounceTime[key] && Date.now() - lastDebounceTime[key] < debounceMs) return;
            lastDebounceTime[key] = Date.now();

            socket.emit('card_update', { card });
        }

        function addCard(x, y) {
            const id = generateId('c');
            const now = new Date().toISOString();
            const cardData = { id, x, y, width: 300, height: 200, content: '<p>新卡片</p>', last_modified: now, last_editor: userId };
            cards.push(cardData);
            const el = createCardElement(cardData);
            canvas.appendChild(el);
            updateAllConnections();
            socket.emit('card_created', { card: cardData });
        }

        function deleteCard(cardId) {
            if (!confirm('确定删除这张卡片？')) return;
            document.querySelector(`[data-card-id="${cardId}"]`)?.remove();
            cards = cards.filter(c => c.id !== cardId);
            connections = connections.filter(cn => cn.fromCardId !== cardId && cn.toCardId !== cardId);
            updateAllConnections();
            socket.emit('card_deleted', { card_id: cardId });
        }

        // 拖动
        let draggingCard = null, dragOffsetX = 0, dragOffsetY = 0;
        function onCardDragStart(e, cardId) {
            if (e.button !== 0) return;
            if (e.target.closest('.card-delete, .connection-point, .card-format-bar, .resize-handle')) return;
            const cardEl = document.querySelector(`[data-card-id="${cardId}"]`);
            const rect = cardEl.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
            draggingCard = cardId;
            cardEl.classList.add('dragging');
        }
        document.addEventListener('mousemove', (e) => {
            if (draggingCard) {
                const cardEl = document.querySelector(`[data-card-id="${draggingCard}"]`);
                const cardData = cards.find(c => c.id === draggingCard);
                if (!cardEl || !cardData) return;
                const canvasRect = canvas.getBoundingClientRect();
                cardData.x = Math.max(0, e.clientX - canvasRect.left - dragOffsetX);
                cardData.y = Math.max(0, e.clientY - canvasRect.top - dragOffsetY);
                cardEl.style.left = cardData.x + 'px';
                cardEl.style.top = cardData.y + 'px';
                updateAllConnections();
            }
        });
        document.addEventListener('mouseup', () => {
            if (draggingCard) {
                const card = cards.find(c => c.id === draggingCard);
                if (card) socket.emit('card_update', { card });
                document.querySelector(`[data-card-id="${draggingCard}"]`)?.classList.remove('dragging');
            }
            draggingCard = null;
        });

        // 调整大小
        let resizingCard = null, resizeStartWidth, resizeStartHeight, resizeStartX, resizeStartY;
        function onResizeStart(e, cardId) {
            e.preventDefault(); e.stopPropagation();
            const cardEl = document.querySelector(`[data-card-id="${cardId}"]`);
            resizingCard = cardId;
            resizeStartWidth = parseInt(cardEl.style.width);
            resizeStartHeight = parseInt(cardEl.style.height);
            resizeStartX = e.clientX; resizeStartY = e.clientY;
        }
        document.addEventListener('mousemove', (e) => {
            if (!resizingCard) return;
            const cardEl = document.querySelector(`[data-card-id="${resizingCard}"]`);
            const cardData = cards.find(c => c.id === resizingCard);
            if (!cardEl || !cardData) return;
            const newWidth = Math.max(220, resizeStartWidth + (e.clientX - resizeStartX));
            const newHeight = Math.max(160, resizeStartHeight + (e.clientY - resizeStartY));
            cardEl.style.width = newWidth + 'px';
            cardEl.style.height = newHeight + 'px';
            cardData.width = newWidth; cardData.height = newHeight;
            updateAllConnections();
        });
        document.addEventListener('mouseup', () => {
            if (resizingCard) {
                const card = cards.find(c => c.id === resizingCard);
                if (card) socket.emit('card_update', { card });
            }
            resizingCard = null;
        });

        // 连线
        let connectingFrom = null, tempLine = null;
        function getPointPos(cardId, side) {
            const el = document.querySelector(`[data-card-id="${cardId}"]`);
            if (!el) return {x:0,y:0};
            const r = el.getBoundingClientRect();
            const cr = canvas.getBoundingClientRect();
            const l = r.left - cr.left, t = r.top - cr.top, w = r.width, h = r.height;
            switch(side) { case 'top': return {x:l+w/2, y:t}; case 'bottom': return {x:l+w/2, y:t+h}; case 'left': return {x:l, y:t+h/2}; case 'right': return {x:l+w, y:t+h/2}; default: return {x:l+w/2, y:t+h/2}; }
        }
        function onPointMouseDown(e, cardId, side) {
            if (e.button !== 0) return;
            e.preventDefault(); e.stopPropagation();
            const pos = getPointPos(cardId, side);
            connectingFrom = { cardId, side, pointX: pos.x, pointY: pos.y };
            tempLine = { endX: pos.x, endY: pos.y };
            document.querySelector(`[data-card-id="${cardId}"] .connection-point.${side}`)?.classList.add('active-connect');
            updateTempLine();
        }
        document.addEventListener('mousemove', (e) => {
            if (connectingFrom) {
                const cr = canvas.getBoundingClientRect();
                tempLine = { endX: e.clientX - cr.left, endY: e.clientY - cr.top };
                updateTempLine();
            }
        });
        document.addEventListener('mouseup', (e) => {
            if (connectingFrom) {
                const elements = document.elementsFromPoint(e.clientX, e.clientY);
                let target = null;
                for (const el of elements) {
                    if (el.classList.contains('connection-point')) {
                        const id = el.getAttribute('data-card-id');
                        const side = el.getAttribute('data-side');
                        if (id && side && id !== connectingFrom.cardId) { target = { cardId: id, side }; break; }
                    }
                }
                if (target) {
                    const exists = connections.some(cn => (cn.fromCardId === connectingFrom.cardId && cn.fromSide === connectingFrom.side && cn.toCardId === target.cardId && cn.toSide === target.side) || (cn.fromCardId === target.cardId && cn.fromSide === target.side && cn.toCardId === connectingFrom.cardId && cn.toSide === connectingFrom.side));
                    if (!exists) {
                        const conn = { id: generateId('l'), fromCardId: connectingFrom.cardId, fromSide: connectingFrom.side, toCardId: target.cardId, toSide: target.side };
                        connections.push(conn);
                        updateAllConnections();
                        socket.emit('connection_created', { connection: conn });
                    }
                }
                resetConnectingState();
            }
        });
        function resetConnectingState() {
            if (connectingFrom) document.querySelector(`[data-card-id="${connectingFrom.cardId}"] .connection-point.${connectingFrom.side}`)?.classList.remove('active-connect');
            connectingFrom = null; tempLine = null; updateTempLine();
        }
        function updateTempLine() {
            if (!connectingFrom || !tempLine) { tempLineSvg.innerHTML = ''; return; }
            tempLineSvg.innerHTML = `<path d="M ${connectingFrom.pointX} ${connectingFrom.pointY} L ${tempLine.endX} ${tempLine.endY}" fill="none" stroke="#ff9f43" stroke-width="3" stroke-dasharray="8 5"/>`;
        }

        function updateAllConnections() {
            let html = '';
            connections.forEach(cn => {
                const from = getPointPos(cn.fromCardId, cn.fromSide);
                const to = getPointPos(cn.toCardId, cn.toSide);
                const dist = Math.max(50, Math.abs(to.x-from.x)*0.4, Math.abs(to.y-from.y)*0.4);
                const off1 = {top:[0,-dist], bottom:[0,dist], left:[-dist,0], right:[dist,0]}[cn.fromSide] || [0,0];
                const off2 = {top:[0,-dist], bottom:[0,dist], left:[-dist,0], right:[dist,0]}[cn.toSide] || [0,0];
                const d = `M ${from.x} ${from.y} C ${from.x+off1[0]} ${from.y+off1[1]}, ${to.x+off2[0]} ${to.y+off2[1]}, ${to.x} ${to.y}`;
                const midX = (from.x+to.x)/2, midY = (from.y+to.y)/2;
                html += `<g class="connection-group" data-connection-id="${cn.id}">
                    <path d="${d}" fill="none" stroke="#2c3e50" stroke-width="2.2" stroke-linecap="round" class="connection-path"/>
                    <circle cx="${midX}" cy="${midY}" r="13" class="conn-delete-btn" />
                    <text x="${midX}" y="${midY}" class="conn-delete-text" text-anchor="middle" dominant-baseline="central">x</text>
                </g>`;
            });
            connectionsSvg.innerHTML = html;
            connectionsSvg.querySelectorAll('.conn-delete-btn, .conn-delete-text').forEach(el => { el.addEventListener('click', () => deleteConnection(el.closest('g').dataset.connectionId)); });
        }

        function deleteConnection(connId) {
            connections = connections.filter(cn => cn.id !== connId);
            updateAllConnections();
            socket.emit('connection_deleted', { connection_id: connId });
        }

        // 粘贴处理
        function handlePaste(e, cardId) {
            const text = e.clipboardData?.getData('text/plain')?.trim();
            if (!text || !/^https?:\/\/\S+$/i.test(text)) return;
            e.preventDefault();
            const cardEl = document.querySelector(`[data-card-id="${cardId}"] .card-content`);
            if (!cardEl) return;
            if (/\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(text)) {
                cardEl.innerHTML += `<img src="${text}" style="max-width:100%">`;
            } else {
                cardEl.innerHTML += `<p><a href="${text}" target="_blank">${text}</a></p>`;
            }
            updateLocalCardData(cardId);
        }

        // 工具栏事件
        document.getElementById('addCardBtn').addEventListener('click', () => {
            const vp = canvasViewport.getBoundingClientRect();
            addCard(canvasViewport.scrollLeft + vp.width/2 - 150, canvasViewport.scrollTop + vp.height/2 - 100);
        });
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (!confirm('确定清空所有内容？')) return;
            cards = []; connections = [];
            canvas.querySelectorAll('.card').forEach(el => el.remove());
            updateAllConnections();
            socket.emit('sync_request');
        });
        document.getElementById('gridToggle').addEventListener('click', () => {
            showGrid = !showGrid;
            canvasViewport.classList.toggle('grid-hidden', !showGrid);
            gridToggleBtn.textContent = showGrid ? '网格: 开' : '网格: 关';
        });
        document.getElementById('syncBtn').addEventListener('click', () => {
            showLoading();
            socket.emit('sync_request');
        });
        document.getElementById('exportBtn').addEventListener('click', () => {
            const data = { cards, connections };
            const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'canvas-export.json';
            a.click();
        });
        document.getElementById('importBtn').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        cards = data.cards || [];
                        connections = data.connections || [];
                        renderAllCards();
                        updateAllConnections();
                        socket.emit('sync_request');
                    } catch (ex) { alert('文件格式错误'); }
                };
                reader.readAsText(file);
            };
            input.click();
        });

        // 画布平移
        let isPanning = false, panStart = {};
        canvasViewport.addEventListener('mousedown', (e) => {
            if (e.target === canvas || e.target === canvasViewport) {
                isPanning = true;
                panStart = { x: e.clientX, y: e.clientY, left: canvasViewport.scrollLeft, top: canvasViewport.scrollTop };
            }
        });
        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                canvasViewport.scrollLeft = panStart.left - (e.clientX - panStart.x);
                canvasViewport.scrollTop = panStart.top - (e.clientY - panStart.y);
            }
        });
        window.addEventListener('mouseup', () => { isPanning = false; });
    })();
    </script>
</body>
</html>
