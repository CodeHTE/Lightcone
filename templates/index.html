<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>协作画布 - 首页</title>
    <style>
        :root {
            --bg: #f4f1ea;
            --surface: #fcfaf5;
            --card-bg: #ffffff;
            --card-border: #d4cdbc;
            --text: #3e3a35;
            --accent: #4a6fa5;
            --accent-hover: #5e8bc2;
            --radius: 12px;
            --shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 16px;
            color: var(--text);
        }
        p {
            font-size: 1.1rem;
            color: #6b6560;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: var(--shadow);
        }
        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 48px;
            text-align: left;
        }
        .feature {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--card-border);
        }
        .feature h3 {
            font-size: 1rem;
            margin-bottom: 8px;
        }
        .feature p {
            font-size: 0.9rem;
            margin-bottom: 0;
        }
        .info {
            margin-top: 32px;
            padding: 16px 24px;
            background: var(--surface);
            border-radius: var(--radius);
            font-size: 0.9rem;
            color: #6b6560;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖌️ 协作画布</h1>
        <p>多人实时协作的白板工具。<br>创建卡片、绘制连接线、实时同步。</p>
        <a href="/canvas" class="btn">打开画布 →</a>

        <div class="features">
            <div class="feature">
                <h3>🌐 实时协作</h3>
                <p>多人同时编辑，自动同步</p>
            </div>
            <div class="feature">
                <h3>👥 在线用户</h3>
                <p>显示当前在线用户及光标</p>
            </div>
            <div class="feature">
                <h3>📝 卡片编辑</h3>
                <p>拖拽、调整大小、富文本</p>
            </div>
            <div class="feature">
                <h3>🔗 连接线</h3>
                <p>卡片之间绘制关系</p>
            </div>
        </div>

        <div class="info">
            💡 提示：打开画布后，可以同时在多个浏览器/标签页中打开，体验实时协作！
        </div>
    </div>
</body>
</html>
